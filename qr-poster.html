<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open House QR Code Poster — 585 N Wendy Dr</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .poster {
            background: #fff;
            border: 3px solid #161B21;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: #161B21;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: #6B7280;
            margin-bottom: 8px;
        }

        .address {
            font-size: 16px;
            font-weight: 600;
            color: #161B21;
            margin-bottom: 4px;
        }

        .date {
            font-size: 14px;
            color: #6B7280;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #C19A3F, transparent);
            margin: 30px 0;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .qr-text {
            font-size: 14px;
            color: #6B7280;
            margin-top: 16px;
        }

        .divider2 {
            height: 2px;
            background: linear-gradient(90deg, transparent, #C19A3F, transparent);
            margin: 30px 0;
        }

        .footer {
            margin-top: 20px;
        }

        .footer-text {
            font-size: 13px;
            color: #6B7280;
            line-height: 1.6;
        }

        .agent-info {
            background: #F6F1E7;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
        }

        .agent-name {
            font-weight: 700;
            color: #161B21;
            margin-bottom: 4px;
        }

        .agent-phone {
            color: #C19A3F;
            text-decoration: none;
            font-weight: 600;
        }

        .controls {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #E7E0D2;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #C19A3F;
            color: #161B21;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(193, 154, 63, 0.3);
        }

        @media print {
            body {
                padding: 0;
                background: #fff;
            }

            .poster {
                box-shadow: none;
                border: none;
                padding: 60px;
            }

            .controls {
                display: none;
            }

            .title {
                font-size: 56px;
            }
        }

        @media (max-width: 600px) {
            .poster {
                padding: 24px;
            }

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- Header -->
        <div class="header">
            <div class="title">🏡 OPEN HOUSE</div>
            <div class="subtitle">Register in seconds</div>
        </div>

        <!-- Property Info -->
        <div class="address">585 N Wendy Dr</div>
        <div style="font-size:14px;color:#6B7280;">Newbury Park, CA 91320</div>
        <div class="date" id="dateDisplay">Saturday, September 12</div>

        <div class="divider"></div>

        <!-- QR Code -->
        <div id="qrcode" style="display:flex;justify-content:center;"></div>
        <div class="qr-text">👆 Scan to register</div>

        <div class="divider2"></div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                📱 Scan the QR code with your phone<br>
                Fill out your name & contact info<br>
                We'll send you all the details!
            </div>

            <div class="agent-info">
                <div class="agent-name">Questions?</div>
                <div>Contact your agent:</div>
                <a href="tel:6614727499" class="agent-phone">📞 (661) 472-7499</a><br>
                <a href="sms:6614727499?body=WENDY" class="agent-phone">💬 Text WENDY</a>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button onclick="window.print()">🖨️ Print Poster</button>
            <button onclick="downloadPoster()">📥 Download as Image</button>
        </div>
    </div>

    <script>
        // Set today's date
        const now = new Date();
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options);

        // Generate QR Code
        const qrText = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/openhouse.html';
        new QRCode(document.getElementById('qrcode'), {
            text: qrText,
            width: 280,
            height: 280,
            colorDark: '#161B21',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        // Download as image
        function downloadPoster() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                html2canvas(document.querySelector('.poster')).then(canvas => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = '585-wendy-open-house-poster.png';
                    link.click();
                });
            }
        }

        // For better poster download, we'll use a simpler approach
        function downloadPoster() {
            alert('Click "Print Poster" above and save as PDF instead - it looks better!\n\nOr use Print > Save as PDF in your browser.');
        }
    </script>
</body>
</html>
